<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Atlas Counseling" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/images/aly-yellow-chair.jpg' | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalBusiness",
    "name": "Atlas Counseling",
    "legalName": "Atlas Counseling, LLC",
    "url": "{{ '/' | absolute_url }}",
    "image": "{{ '/images/aly-yellow-chair.jpg' | absolute_url }}",
    "logo": "{{ '/images/Atlas-Counseling-logo-transparent.png' | absolute_url }}",
    "telephone": "+1-208-516-1003",
    "faxNumber": "+1-208-516-1014",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "1329 Ammon Park Dr",
      "addressLocality": "Ammon",
      "addressRegion": "ID",
      "postalCode": "83406",
      "addressCountry": "US"
    },
    "areaServed": [
      { "@type": "City", "name": "Ammon, Idaho" },
      { "@type": "City", "name": "Idaho Falls, Idaho" },
      { "@type": "State", "name": "Idaho" },
      { "@type": "State", "name": "Utah" }
    ],
    "medicalSpecialty": "Psychiatric",
    "knowsAbout": ["EMDR", "Trauma therapy", "Internal Family Systems", "Ketamine-Assisted Psychotherapy", "Clinical supervision"],
    "employee": {
      "@type": "Person",
      "name": "Aly Webster",
      "jobTitle": "Licensed Clinical Professional Counselor (LCPC)",
      "url": "{{ '/about.html' | absolute_url }}"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="/images/atlasfavicon.png" />
